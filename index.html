<div class="app-wrap">
  <div class="phone" id="phone">

    <!-- status bar (tampil di frame desktop / HP) -->

      <span class="sb-time" id="sbTime">09:41</span>
      <span class="sb-right">
        <svg class="ic sb-ic" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5.2 12.2a10.4 10.4 0 0 1 13.6 0M8.5 15.9a5.8 5.8 0 0 1 7 0M12 19.4h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    <main id="stage" class="stage">
      <!-- SPLASH (langsung tampil sebelum JS) -->
      <section class="screen active" data-screen="splash">
        <div class="splash">
          <div class="splash-glow"></div>
          <img class="splash-logo" src="./assets/logo.png" alt="SANTARA" onerror="this.style.display='none';document.getElementById('splashTxt').style.display='block'">
          <div id="splashTxt" style="display:none">
            <div class="wordmark">SANTARA</div>
            <div class="tagline">SETIA ANTAR TANPA RAGU</div>
          </div>
          <div class="splash-bar"><i></i></div>
        </div>
      </section>
    </main>

    <!-- bottom tab bar -->
    <nav class="tabbar" id="tabbar" hidden></nav>

    <!-- sheets / modals -->
    <div class="sheet-host" id="sheetHost"></div>
    <div class="toast-host" id="toastHost"></div>
  </div>
